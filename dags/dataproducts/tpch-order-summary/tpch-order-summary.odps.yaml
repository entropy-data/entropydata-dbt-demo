apiVersion: v1.0.0
kind: DataProduct
id: tpch-order-summary
name: Order Summary
version: 1.0.0
status: active
domain: sales
description:
  purpose: One row per order, enriched with customer, nation and region, plus aggregated line item metrics (quantities, gross
    and net revenue, tax).
  usage: 'Order-level reporting: order volumes, revenue per order, order status and priority analysis. Query "hive-iceberg".demo.order_summary
    in Trino.'
  limitations: Based on TPC-H benchmark data, not real business data.
team:
  name: analytics-engineering
inputPorts:
- name: tpch-core
  version: 1.0.0
  contractId: tpch-core
outputPorts:
- name: order-summary
  description: Table "hive-iceberg".demo.order_summary, built by dbt.
  version: 1.0.0
  type: trino
  contractId: tpch-order-summary
  customProperties:
  - property: displayName
    value: Order Summary
  - property: openInLinks
    value:
    - name: Superset (SQL Lab)
      url: ${SUPERSET_URL}/sqllab/?dbid=1&name=Order%20Summary&sql=SELECT%20%2A%20FROM%20%22hive-iceberg%22.demo.order_summary%20LIMIT%20100
tags:
- tpch
- consumer-aligned
- dbt
customProperties:
- property: dataProductBuilder
  value: https://github.com/entropy-data/entropydata-dbt-demo-builder
