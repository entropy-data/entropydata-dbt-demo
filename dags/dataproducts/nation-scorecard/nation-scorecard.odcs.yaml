apiVersion: v3.2.0
kind: DataContract
id: nation-scorecard
name: Nation Scorecard
version: 1.0.0
status: active
team:
  name: analytics-engineering
description:
  purpose: 'How each nation is doing as a market: revenue, customer value, delivery quality and local supply, in one row per nation. Built on the published mart data products.'
servers:
- server: trino
  type: trino
  host: trino-coordinator
  port: 8443
  catalog: hive-iceberg
  schema: nation_scorecard
schema:
- name: nation_scorecard
  logicalType: object
  properties:
  - name: nation
    primaryKey: true
    required: true
    unique: true
    authoritativeDefinitions:
    - type: semantics
      url: http://www.example.com/ns/tpch/Nation/nationName
    logicalType: string
  - name: region
    authoritativeDefinitions:
    - type: semantics
      url: http://www.example.com/ns/tpch/Region/regionName
    logicalType: string
  - name: net_revenue
    logicalType: number
    description: Net revenue of orders from customers in the nation.
  - name: order_count
    logicalType: integer
    description: Number of orders from customers in the nation.
  - name: customer_count
    logicalType: integer
    description: Number of customers in the nation who ordered.
  - name: avg_customer_lifetime_value
    logicalType: number
    description: Average lifetime net revenue per customer in the nation.
  - name: late_delivery_rate
    logicalType: number
    description: Share of shipments to the nation received after the commit date.
  - name: return_rate
    logicalType: number
    description: Share of shipped items to the nation that were returned.
  - name: local_suppliers
    logicalType: integer
    description: Number of suppliers located in the nation.
  - name: local_supplier_revenue
    logicalType: number
    description: Net revenue of suppliers located in the nation.
  description: One row per nation.
