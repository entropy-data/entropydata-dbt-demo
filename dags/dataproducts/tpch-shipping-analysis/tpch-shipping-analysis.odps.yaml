outputPorts:
- name: shipping-analysis
  description: Table "hive-iceberg".demo.shipping_analysis, built by dbt.
  version: 1.0.0
  type: trino
  contractId: tpch-shipping-analysis
  customProperties:
  - property: displayName
    value: Shipping Analysis
tags:
- tpch
- consumer-aligned
- dbt
customProperties:
- property: dataProductBuilder
  value: https://github.com/entropy-data/entropydata-dbt-demo-builder
