---
apiVersion: v1
kind: Secret
metadata:
  name: initial-opensearch-security-config
  namespace: platform
stringData:
  internal_users.yml: |
    ---
    _meta:
      type: internalusers
      config_version: 2
    admin:
      hash: $2y$10$xRtHZFJ9QhG9GcYhRpAGpufCZYsk//nxsuel5URh0GWEBgmiI4Q/e
      reserved: true
      backend_roles:
      - admin
      description: OpenSearch admin user
    logs:
      hash: $2y$10$LnPJaCbfHJYASAkEhwFDzuEDAs3YngxuL7m243O7Wa7jaD6QiRqTy
      backend_roles:
      - logs
      description: Vector aggregator log writer
  roles.yml: |
    ---
    _meta:
      type: roles
      config_version: 2
    logs_writer:
      cluster_permissions:
        - cluster_monitor
        - cluster_composite_ops
      index_permissions:
        - index_patterns: ["logs-*"]
          allowed_actions:
            - "indices:data/write/bulk*"
            - "indices:data/write/index"
            - "indices:admin/create"
            - "indices:admin/mapping/put"
            - "indices:admin/mappings/fields/get"
  roles_mapping.yml: |
    ---
    _meta:
      type: rolesmapping
      config_version: 2
    all_access:
      reserved: false
      backend_roles:
      - admin
    logs_writer:
      backend_roles:
      - logs
